# CRM Lead — déploiement sur UN serveur (VPS Ubuntu + Docker).
#
#   Internet ──443/80──► nginx ──► web (Next.js : UI + API + tâches de fond) ──► mysql
#                                    └──────────────► scraper (FastAPI + Chromium)
#
# Seul nginx est exposé. MySQL et le scraper ne sont joignables que sur le réseau interne.
#
#   cp deploy/.env.production.example deploy/.env   # puis compléter
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Voir deploy/README.md (première installation, certificat TLS, sauvegardes).

name: crm-lead

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mysql://crm:${MYSQL_PASSWORD}@mysql:3306/crm
  APP_BASE_URL: https://${DOMAIN}
  SCRAPER_API_URL: http://scraper:8000
  UPLOAD_DIR: /app/uploads

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucrm -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot à chaque déploiement : migrations Prisma versionnées puis init prod
  # (admin + étapes pipeline, idempotent — ne réécrit jamais un mot de passe existant).
  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: build
    restart: "no"
    env_file: .env
    environment: *app-env
    command: sh -c "pnpm --filter @crm/db migrate:deploy && pnpm --filter @crm/db init-prod"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      scraper:
        condition: service_started

  scraper:
    build:
      context: ..
      dockerfile: apps/scraper/Dockerfile
    restart: unless-stopped
    env_file: .env
    shm_size: 1gb # Chromium : /dev/shm trop petit par défaut

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    # Recharge la config toutes les 6 h pour prendre en compte les certificats renouvelés.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]

  # Renouvellement automatique Let's Encrypt (webroot, toutes les 12 h).
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  mysql-data:
  uploads:
  certbot-www:
  letsencrypt:
