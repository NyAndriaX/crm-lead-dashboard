# Construit l'image de démonstration (deploy/render/Dockerfile) et la publie sur GitHub Container Registry.
# Render (offre gratuite) déploie ensuite cette image : la construction se fait ici, pas chez Render.
name: render-image

on:
  workflow_dispatch:
  push:
    branches: [feat/CRM-architecture-v2, main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nyandriax/crm-lead-web:render
          cache-from: type=gha
          cache-to: type=gha,mode=max
