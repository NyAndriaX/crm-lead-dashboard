# Garde la démo Render éveillée À LA DEMANDE (« Run workflow ») pendant N heures, ex. avant une soutenance.
# Le maintien quotidien est fait par l'application elle-même (job keep-awake, packages/jobs/src/keepAwake.ts) ;
# la planification GitHub (« schedule ») a été retirée : trop irrégulière (exécutions retardées de plusieurs heures).
name: render-keep-awake

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Durée d'éveil en heures (1 à 5)"
        default: "3"

permissions: {}

env:
  URLS: >-
    https://crm-lead-nqdg.onrender.com/api/health
    https://crm-lead-scraper.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Réveil des services
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          ping_all() {
            for u in $URLS; do
              # Jusqu'à 3 min : le réveil d'un service endormi prend environ une minute.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 "$u" || echo 000)
              echo "$(date -u +%H:%M) $code $u"
            done
          }
          ping_all
          h=$(( ${HOURS//[^0-9]/} + 0 )); [ "$h" -gt 5 ] && h=5
          for _ in $(seq 1 $(( h * 6 ))); do sleep 600; ping_all; done
