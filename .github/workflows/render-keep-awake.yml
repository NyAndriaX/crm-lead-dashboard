# Garde la démo Render éveillée (offre gratuite : veille après 15 min sans visite).
# - Planifié : du lundi au vendredi, 7 h – 21 h heure de Madagascar (4 h – 18 h UTC), toutes les 10 min.
#   Deux services × ~14 h × ~23 jours ≈ 650 h/mois, sous le quota de 750 h du compte Render.
#   (24 h/24 pour les deux services ≈ 1 440 h : quota épuisé vers le 15, services suspendus.)
# - À la demande (« Run workflow ») : garde les deux services éveillés pendant N heures, ex. une soutenance.
# GitHub n'exécute les déclencheurs « schedule » que depuis la branche par défaut (main), avec parfois
# quelques minutes de retard : l'intervalle de 10 min laisse de la marge avant les 15 min de veille.
name: render-keep-awake

on:
  schedule:
    - cron: "*/10 4-17 * * 1-5"
  workflow_dispatch:
    inputs:
      hours:
        description: "Durée d'éveil en heures (1 à 5)"
        default: "3"

permissions: {}

env:
  URLS: >-
    https://crm-lead-nqdg.onrender.com/api/health
    https://crm-lead-scraper.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Réveil des services
        env:
          HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours || '0' }}
        run: |
          ping_all() {
            for u in $URLS; do
              # Jusqu'à 3 min : le réveil d'un service endormi prend environ une minute.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 "$u" || echo 000)
              echo "$(date -u +%H:%M) $code $u"
            done
          }
          ping_all
          h=$(( ${HOURS//[^0-9]/} + 0 )); [ "$h" -gt 5 ] && h=5
          for _ in $(seq 1 $(( h * 6 ))); do sleep 600; ping_all; done
