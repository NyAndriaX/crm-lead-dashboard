# Docker Compose — CRM Lead Dashboard
# MongoDB externe (Atlas, VPS…) — DATABASE_URL dans .env
# ⚠️  Dans .env de prod, mettre SCRAPER_API_URL avec l'IP réelle du serveur
#     (pas 127.0.0.1 qui pointe sur le container lui-même) :
#     SCRAPER_API_URL="http://<IP_DU_SERVEUR>:8000"
#
# docker compose up --build -d
# docker compose logs -f

networks:
  crm:
    driver: bridge

services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    networks: [crm]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    networks: [crm]
    depends_on:
      web:
        condition: service_healthy
