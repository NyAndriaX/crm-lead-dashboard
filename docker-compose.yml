# Docker Compose — CRM Lead Dashboard (dev/preprod)
# Services : nextjs · worker · mongo (replica set 1 nœud) · nginx
# Pas de Redis : la file de tâches asynchrones est stockée dans MongoDB
# (collection `jobs`) et consommée par le worker en polling.
# Le service `scraper` (Python) sera ajouté ultérieurement.
#
# Démarrer l'infra seule :   docker compose up -d mongo
# Tout le stack :            docker compose up --build

services:
  nextjs:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: "mongodb://mongo:27017/crm?replicaSet=rs0"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [crm-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: "mongodb://mongo:27017/crm?replicaSet=rs0"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [crm-network]

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks: [crm-network]
    healthcheck:
      # Initialise le replica set au premier démarrage puis vérifie qu'il répond
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok
          }
        " | grep 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"   # activer avec les certificats en pré-prod
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
    networks: [crm-network]

networks:
  crm-network:
    driver: bridge

volumes:
  mongo-data:
