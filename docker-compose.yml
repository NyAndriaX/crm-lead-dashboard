# Docker Compose — CRM Lead Dashboard
# MongoDB externe (Atlas, VPS…) — DATABASE_URL dans .env
#
# docker compose up --build -d
# docker compose logs -f

networks:
  crm:
    driver: bridge

services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SCRAPER_API_URL: "http://host.docker.internal:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [crm]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SCRAPER_API_URL: "http://host.docker.internal:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [crm]
    depends_on:
      web:
        condition: service_healthy
